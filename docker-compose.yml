services:

#NGINX SERVICE

  nginx:
    build: ./nginx
    container_name: nginxv1

    ports:
      - "80:80"

    depends_on:
      - flask_sql

#FLASK SERVICE

  flask_sql:
    build: .
    container_name: flask_sql

    ports:
      - "1601:1601"

    env_file:
      - .env  

    depends_on:
      mysql_db:
        condition: service_healthy

    environment:
      MYSQL_HOST: mysql_db
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MY_SQL_ROOT_PASSWORD}
      MYSQL_DB: ${MY_SQL_DATABASE}
      SECRET_KEY: ${SECRET_KEY}

   #MYSQL SERVICE

  mysql_db:
    image: mysql:latest
    container_name: mysql_db

    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MY_SQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MY_SQL_DATABASE}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MY_SQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
   
volumes:
  mysql_data:
  