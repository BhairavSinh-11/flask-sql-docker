version: '3.9'

services:
 Flask_sql:
  build: .
  containers_name: flask_sql 
  ports:
   - "1601:1601"
  depends_on:
    - mysql_db
  environment:
    MYSQL_HOST: mysql-db
    MYSQL_USER: root
    MYSQL_PASSWORD: password
    MYSQL_DB: flaskdb      
    SECRET_KEY: supersecretkey
  volumes:
      - .:/app

  mysql_db:
    image: mysql:latest
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: sql@2423
      MYSQL_DATABASE: flask_auth
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
      mysql_data:   
