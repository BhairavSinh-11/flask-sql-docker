version: '3.9'

services:
 Flask_sql:
  build: .
  containers_name: flask_sql 
  ports:
   - "1601:1601"
  depends_on:
    - mysql_db
  environment:
    MYSQL_HOST: mysql-db
    MYSQL_USER: root
    MYSQL_PASSWORD: ${MY_SQL_ROOT_PASSWORD}
    MYSQL_DB: ${MY_SQL_DATABASE}      
    SECRET_KEY: ${SECRET_KEY}
  volumes:
      - .:/app

  mysql_db:
    image: mysql:latest
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MY_SQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MY_SQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
      mysql_data:   
